name: Generar páginas de clientes

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "datos/clientes.yaml"
      - "datos/datos.yaml"
      - "scripts/generar-clientes.js"
      - "lib/js-yaml.min.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar clientes/*/index.html desde datos/datos.yaml
        run: node scripts/generar-clientes.js

      - name: Commitear páginas generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clientes
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar páginas de clientes automáticamente"
            git push
          fi
