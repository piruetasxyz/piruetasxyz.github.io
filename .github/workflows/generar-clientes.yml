name: generar clientes

on:
  push:
    branches:
      - main
    paths:
      - 'datos/datos.yaml'
      - 'scripts/generar-clientes.js'
      - 'lib/js-yaml.min.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: generar clientes/*/index.html
        run: node scripts/generar-clientes.js

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'generar clientes/*/index.html [ci skip]'
          file_pattern: 'clientes/**/index.html'
