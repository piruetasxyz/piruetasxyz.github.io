name: Generar página de personas

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "datos/datos.yaml"
      - "scripts/generar-personas.js"
      - "scripts/lib/**"
      - "lib/js-yaml.min.js"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Hornear personas/index.html desde datos/datos.yaml
        run: node scripts/generar-personas.js

      - name: Commitear página generada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add personas
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Generar página de personas automáticamente"
            git push
          fi
