          chufe es una fuente de alimentación eurorack de hardware
          abierto, hecha por piruetas.
          recibe 12 V DC por un jack y entrega ±12V y +5V en un header
          de alimentación eurorack de 16 pines y en un conector molex
          KK-396 de 4 pines, con un LED para cada línea.
          está hecha para alimentar un bus como
          <a href="/proyectos/chufebu/index.html">chufebu</a>.
          está diseñada en KiCad 10 con las bibliotecas estándar de
          KiCad y una pieza de terceros.
        en: |-
          chufe is an open source hardware eurorack power supply
          by piruetas.
          It takes 12 V DC from a barrel jack and outputs ±12V and
          +5V on a 16-pin eurorack power header and a 4-pin Molex
          KK-396 connector, with an LED for each rail.
          It is designed to feed a power bus such as
          <a href="/proyectos/chufebu/index.html">chufebu</a>.
          It is designed in KiCad 10 with KiCad's standard
          libraries plus one third-party part.

    - id: caracteristicas
      titulo:
        es: 'características'
        en: 'features'
      content:
        es: |-
          entrada de 12 V DC por jack, con protección contra polaridad inversa.<br>
          salidas de +12V y -12V desde un convertidor DC-DC aislado de 20 W.<br>
          salida de +5V desde un regulador lineal L7805.<br>
          1 header de alimentación eurorack de 16 pines (2x08) y 1 conector molex KK-396 de 4 pines: -12V, GND, +5V y +12V.<br>
          4 LEDs indicadores: entrada, -12V, +12V y +5V.<br>
          placa de 50 × 65 mm, 2 capas, con 4 agujeros de montaje M3.
        en: |-
          12 V DC barrel jack input, with reverse polarity protection.<br>
          +12V and -12V outputs from a 20 W isolated DC-DC converter.<br>
          +5V output from an L7805 linear regulator.<br>
          1 eurorack power header, 16 pins (2x08), and 1 Molex KK-396 4-pin connector: -12V, GND, +5V and +12V.<br>
          4 indicator LEDs: input, -12V, +12V and +5V.<br>
          50 × 65 mm board, 2 layers, with 4 M3 mounting holes.

    - id: producto
      titulo:
        es: 'producto'
        en: 'product'
      content:
        es: |-
          piruetas vende chufe armado y probado.<br>
          versión v0.1 rev-a: octubre 2026, todavía sin probar.
        en: |-
          piruetas sells chufe assembled and tested.<br>
          Version v0.1 rev-a: October 2026, not yet tested.

    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          manual de uso, esquemático, placa y bill of materials: <a href="https://piruetas.xyz/chufe/">piruetas.xyz/chufe</a><br>
          archivos fuente de KiCad y de fabricación: <a href="https://github.com/piruetasxyz/chufe">github.com/piruetasxyz/chufe</a>
        en: |-
          user manual, schematic, board and bill of materials (in Spanish): <a href="https://piruetas.xyz/chufe/">piruetas.xyz/chufe</a><br>
          KiCad source and fabrication files: <a href="https://github.com/piruetasxyz/chufe">github.com/piruetasxyz/chufe</a>

    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          aarón montoya-moraga: investigación, esquemático, pcb, fabricación y documentación.<br>
          matías serrano: revisor experto de esquemáticos y pcbs.
        en: |-
          aarón montoya-moraga: research, schematic, PCB, manufacturing and documentation.<br>
          matías serrano: expert schematic and PCB reviewer.

    - id: licencia
      titulo:
        es: 'licencia'
        en: 'license'
      content:
        es: 'hardware bajo CERN-OHL-P-2.0 y documentación bajo CC-BY-SA-4.0. el símbolo, la huella y los modelos 3D del convertidor DC-DC son de EasyEDA / LCSC / JLCPCB y no están cubiertos por estas licencias.'
        en: 'hardware licensed under CERN-OHL-P-2.0 and documentation under CC-BY-SA-4.0. The DC-DC converter symbol, footprint and 3D models are from EasyEDA / LCSC / JLCPCB and are not covered by these licenses.'

boton:
  es: 'boton'
  en: 'boton'
  meta:
    es: '2025'
    en: '2025'
  etiqueta:
    es: 'bibliotecas'
    en: 'libraries'

  imagenes:
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2025-piruetas-boton/svg/boton-diagrama.svg'
      alt:
        es: 'diagrama de flujo de señal de boton v0.1.0'
        en: 'boton v0.1.0 signal flow diagram'

  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          boton es una biblioteca de piruetas para leer botones con
          microcontroladores, con antirrebote incluido.
          funciona con placas Arduino y Raspberry Pi Pico, tanto desde
          Arduino como desde el Pico SDK.
        en: |-
          boton is a piruetas library for reading buttons with
          microcontrollers, with built-in debouncing.
          It works with Arduino and Raspberry Pi Pico boards, both from
          Arduino and from the Pico SDK.

    - id: caracteristicas
      titulo:
        es: 'características'
        en: 'features'
      content:
        es: |-
          el botón va entre una patita digital y tierra (GND), sin resistencia externa: usa el pull-up interno.<br>
          5 ejemplos para Arduino y para Pico SDK: leer, encender un led, alternar un led, contar pulsaciones y dos botones.
        en: |-
          The button goes between a digital pin and ground (GND), with no external resistor: it uses the internal pull-up.<br>
          5 examples for Arduino and for Pico SDK: read, light an LED, toggle an LED, count presses and two buttons.

    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          código fuente, ejemplos y referencia: <a href="https://github.com/piruetasxyz/Boton">github.com/piruetasxyz/Boton</a>
        en: |-
          source code, examples and reference (in Spanish): <a href="https://github.com/piruetasxyz/Boton">github.com/piruetasxyz/Boton</a>

    - id: licencia
      titulo:
        es: 'licencia'
        en: 'license'
      content:
        es: 'código bajo licencia MIT.'
        en: 'code licensed under MIT.'

perilla:
  es: 'perilla'
  en: 'perilla'
  meta:
    es: '2025'
    en: '2025'
  etiqueta:
    es: 'bibliotecas'
    en: 'libraries'

  imagenes:
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2025-piruetas-perilla/svg/perilla-diagrama.svg'
      alt:
        es: 'diagrama de flujo de señal de perilla v0.1.0'
        en: 'perilla v0.1.0 signal flow diagram'

  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          perilla es una biblioteca de piruetas para leer perillas
          (potenciómetros) con microcontroladores, y mapear su valor
          a otro rango.
          funciona con placas Arduino y Raspberry Pi Pico, tanto desde
          Arduino como desde el Pico SDK.
        en: |-
          perilla is a piruetas library for reading knobs
          (potentiometers) with microcontrollers, and mapping their
          value to another range.
          It works with Arduino and Raspberry Pi Pico boards, both from
          Arduino and from the Pico SDK.

    - id: caracteristicas
      titulo:
        es: 'características'
        en: 'features'
      content:
        es: |-
          lee una entrada análoga y mapea el valor a otro rango (ej. de 0-1023 a 0-100).<br>
          4 ejemplos para Arduino y para Pico SDK: leer, brillo de un led, umbral y dos perillas.
        en: |-
          Reads an analog input and maps the value to another range (e.g. from 0-1023 to 0-100).<br>
          4 examples for Arduino and for Pico SDK: read, LED brightness, threshold and two knobs.

    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          código fuente, ejemplos y referencia: <a href="https://github.com/piruetasxyz/Perilla">github.com/piruetasxyz/Perilla</a>
        en: |-
          source code, examples and reference (in Spanish): <a href="https://github.com/piruetasxyz/Perilla">github.com/piruetasxyz/Perilla</a>

    - id: licencia
      titulo:
        es: 'licencia'
        en: 'license'
      content:
        es: 'código bajo licencia MIT.'
        en: 'code licensed under MIT.'

