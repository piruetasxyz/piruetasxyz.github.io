parla:
  es: 'parla'
  en: 'parla'
  meta:
    es: '2025'
    en: '2025'
  etiqueta:
    es: 'popusintes'
    en: 'popusintes'

  hero:
    image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2025-piruetas-parla/jpg/parla-canasto.jpg'
    alt:
      es: 'parla'
      en: 'parla'

  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          parla es un proyecto de piruetas, en colaboración con
          rafita studio y misaa.cc.
          es un pequeño parlante con un amplificador mono, para
          uso con sintetizadores.
          nace en respuesta a los altos costos de parlantes con
          bluetooth, y a que muchos de ellos hoy en día ya no
          cuentan con entrada vía cable.
        en: |-
          parla is a project by piruetas, in collaboration with
          rafita studio and misaa.cc.
          It is a small speaker with a mono amplifier for use with
          synthesizers.
          It was born in response to the high cost of Bluetooth
          speakers and the fact that many of them no longer
          include a wired input.

    - id: producto
      titulo:
        es: 'producto'
        en: 'product'
      content:
        es: |-
          para este proyecto hicimos 50 PCBs, de las cuales 5
          están disponibles en este formato PCB con componentes
          SMT.
          este producto consiste en la PCB del proyecto,
          diseñada en santiago de chile, ensamble SMD en hong
          kong.
          no incluye circuitos integrados, ni potenciómetro, ni
          parlante, ni carcasa.
          entrega en santiago de chile.
        en: |-
          For this project we made 50 PCBs, of which 5 are
          available in this PCB format with SMT components.
          This product consists of the project PCB, designed in
          Santiago de Chile, SMD assembly in Hong Kong.
          It does not include integrated circuits, potentiometer,
          speaker, or enclosure.
          Delivery in Santiago de Chile.

    - id: nota
      titulo:
        es: 'nota técnica'
        en: 'technical note'
      content:
        es: '👁️ <strong>nota:</strong> para esta primera versión se requiere una correccion de polaridad vcc y gnd.'
        en: '👁️ <strong>note:</strong> for this first version a VCC and GND polarity correction is required.'

    - id: creditos
      titulo:
        en: 'credits'
        es: 'créditos'
      content:
        es: |-
          empresa: @piruetas.xyz<br>
          concepto: @montoyamoraga<br>
          pcb: @misaa.cc<br>
          gráfica y fotografía: @rafita.studio<br>
          logística: @jnsplv<br>
          tipografía: @uno_ca
        en: |-
          company: @piruetas.xyz<br>
          concept: @montoyamoraga<br>
          pcb: @misaa.cc<br>
          graphic design and photography: @rafita.studio<br>
          logistics: @jnsplv<br>
          font: @uno_ca

chufebu:
  es: 'chufebu'
  en: 'chufebu'
  meta:
    es: '2026'
    en: '2026'
  etiqueta:
    es: 'popusintes'
    en: 'popusintes'

  imagenes:
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-piruetas-chufebu/svg/chufebu-esquematico.svg'
      alt:
        es: 'esquemático de chufebu v0.1 rev-a'
        en: 'chufebu v0.1 rev-a schematic'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-piruetas-chufebu/svg/chufebu-placa.svg'
      alt:
        es: 'placa de chufebu v0.1 rev-a'
        en: 'chufebu v0.1 rev-a board'
    - video: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-piruetas-chufebu/mp4/chufebu-placa-3d-giro.mp4'
      alt:
        es: 'render 3D de la placa de chufebu v0.1 rev-a, girando'
        en: '3D render of the chufebu v0.1 rev-a board, turning'

  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          chufebu es un bus de alimentación eurorack de hardware
          abierto, hecho por piruetas.
          distribuye ±12V, +5V, CV y GATE a cinco headers de
          alimentación eurorack de 16 pines, cada uno con su propio
          conector molex KK-396 de 4 pines para pruebas.
          está diseñado en KiCad 10 usando solamente las bibliotecas
          estándar de KiCad.
        en: |-
          chufebu is an open source hardware eurorack power bus
          board by piruetas.
          It distributes ±12V, +5V, CV and GATE to five 16-pin
          eurorack power headers, each one paired with its own
          4-pin Molex KK-396 connector for testing.
          It is designed in KiCad 10 using only KiCad's standard
          libraries.

    - id: caracteristicas
      titulo:
        es: 'características'
        en: 'features'
      content:
        es: |-
          5 headers de alimentación eurorack de 16 pines (2x08), conectados en bus.<br>
          5 conectores molex KK-396 de 4 pines: -12V, GND, +5V y +12V.<br>
          las líneas CV y GATE también van en bus entre los 5 headers.<br>
          placa de 100 × 45 mm, 2 capas, con 2 agujeros de montaje M3.
        en: |-
          5 eurorack power headers, 16 pins (2x08), bussed together.<br>
          5 Molex KK-396 4-pin connectors: -12V, GND, +5V and +12V.<br>
          CV and GATE lines are also bussed across the 5 headers.<br>
          100 × 45 mm board, 2 layers, with 2 M3 mounting holes.

    - id: producto
      titulo:
        es: 'producto'
        en: 'product'
      content:
        es: |-
          piruetas vende chufebu armado y probado.<br>
          versión v0.1 rev-a: fabricada en octubre 2026, todavía sin probar.
        en: |-
          piruetas sells chufebu assembled and tested.<br>
          Version v0.1 rev-a: manufactured in October 2026, not yet tested.

    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          manual de uso, esquemático, placa y bill of materials: <a href="https://piruetas.xyz/chufebu/">piruetas.xyz/chufebu</a><br>
          archivos fuente de KiCad y de fabricación: <a href="https://github.com/piruetasxyz/chufebu">github.com/piruetasxyz/chufebu</a>
        en: |-
          user manual, schematic, board and bill of materials (in Spanish): <a href="https://piruetas.xyz/chufebu/">piruetas.xyz/chufebu</a><br>
          KiCad source and fabrication files: <a href="https://github.com/piruetasxyz/chufebu">github.com/piruetasxyz/chufebu</a>

    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          aarón montoya-moraga: investigación, esquemático, pcb, fabricación y documentación.<br>
          matías serrano: revisor experto de esquemáticos y pcbs.
        en: |-
          aarón montoya-moraga: research, schematic, PCB, manufacturing and documentation.<br>
          matías serrano: expert schematic and PCB reviewer.

    - id: licencia
      titulo:
        es: 'licencia'
        en: 'license'
      content:
        es: 'hardware bajo CERN-OHL-P-2.0 y documentación bajo CC-BY-SA-4.0.'
        en: 'hardware licensed under CERN-OHL-P-2.0 and documentation under CC-BY-SA-4.0.'

