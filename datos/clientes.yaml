rocio-c-gomez:
  titulo:
    es: 'Rocío C. Gómez'
    en: 'Rocío C. Gómez'
  materiales:
    es: 'Raspberry Pi'
    en: 'Raspberry Pi'
  software:
    es: 'Python, Bash'
    en: 'Python, Bash'
  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          scripts en Python, automatización con Bash y configuración
          de Raspberry Pi para la obra <em>Cultivan el desorden en
          todas sus formas</em> de la artista Rocío C. Gómez,
          presentada en el Centro Cultural de España en Santiago como
          parte de la residencia
          <a href="https://ccesantiago.aecid.es/w/residencia-soltar-la-lengua">Soltar la lengua</a>.
        en: |-
          Python scripts, Bash automation and Raspberry Pi setup for
          the piece <em>Cultivan el desorden en todas sus formas</em>
          by artist Rocío C. Gómez, presented at Centro Cultural de
          España in Santiago as part of the residency
          <a href="https://ccesantiago.aecid.es/w/residencia-soltar-la-lengua">Soltar la lengua</a>.
    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          Aarón Montoya-Moraga: programación en Python, programación en Bash y configuración de hardware.<br>
          Mateo Arce Moore: programación en Python e investigación de hardware.<br>
          Janis Sepúlveda Vera: pruebas de software e investigación de hardware.
        en: |-
          Aarón Montoya-Moraga: Python programming, Bash programming and hardware setup.<br>
          Mateo Arce Moore: Python programming and hardware research.<br>
          Janis Sepúlveda Vera: software testing and hardware research.

