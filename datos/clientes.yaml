      alt:
        es: 'Claudia González Godoy, placa 10'
        en: 'Claudia González Godoy, plate 10'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-claudia-gonzalez-godoy-placas/webp/11.webp'
      alt:
        es: 'Claudia González Godoy, placa 11'
        en: 'Claudia González Godoy, plate 11'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-claudia-gonzalez-godoy-placas/webp/12.webp'
      alt:
        es: 'Claudia González Godoy, placa 12'
        en: 'Claudia González Godoy, plate 12'
  sections:
    - titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          proyecto realizado para el curso aplicaciones tecnológicas
          dictado por la profesora claudia gonzález godoy en el
          magíster de artes mediales de la universidad de chile.
          <br><br>
          tomamos los fundamentos de lo enseñado en el curso,
          incluyendo el chip 555 usado en configuración astable como
          reloj, el chip 4017 como secuenciador, y el chip 4093 como
          oscilador, y lo portamos a placas pcb para ser usadas en los
          proyectos finales de les estudiantes del curso.
        en: |-
          project made for the course aplicaciones tecnológicas
          (technological applications), taught by professor claudia
          gonzález godoy in the master's in media arts at universidad
          de chile.
          <br><br>
          we took the fundamentals taught in the course, including
          the 555 chip used in astable configuration as a clock, the
          4017 chip as a sequencer, and the 4093 chip as an
          oscillator, and ported them to pcbs to be used in the
          course students' final projects.

biblioteca-cuir:
  titulo:
    es: 'Biblioteca Cuir'
    en: 'Biblioteca Cuir'
  galeria:
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-biblioteca-cuir-web/webp/portada-foto-actividad.webp'
      alt:
        es: 'sitio web de Biblioteca Cuir, portada con foto de una actividad'
        en: 'Biblioteca Cuir website, cover with a photo of an event'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2026-biblioteca-cuir-web/webp/inicio-objetos-coleccion.webp'
      alt:
        es: 'sitio web de Biblioteca Cuir, inicio con objetos de la colección'
        en: 'Biblioteca Cuir website, home page with objects from the collection'
  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          diseño e implementación de sitio web, incluyendo tanto la digitalización de los archivos de la Biblioteca Cuir como de sus proyectos.
        en: |-
          design and implementation of a website, including the digitization of both the Biblioteca Cuir archives and its projects.
    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          sitio web: <a href="https://bibliotecacuir.org">bibliotecacuir.org</a><br>
          infraestructura web: <a href="https://github.com/bibliotecaCuir">github.com/bibliotecaCuir</a>
        en: |-
          website: <a href="https://bibliotecacuir.org">bibliotecacuir.org</a><br>
          web infrastructure: <a href="https://github.com/bibliotecaCuir">github.com/bibliotecaCuir</a>
    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          Aarón Montoya-Moraga: diseño de la arquitectura web e implementación de GitHub Actions para automatización.<br>
          Janis Sepúlveda: investigación de usuarios, entrevistas a clientes, diagramas de flujo, wireframes y prototipado.<br>
          Mateo Arce Moore: programación web.
        en: |-
          Aarón Montoya-Moraga: web architecture design and implementation of GitHub Actions for automation.<br>
          Janis Sepúlveda: user research, client interviews, flowcharts, wireframes and prototyping.<br>
          Mateo Arce Moore: web programming.

sokio:
  titulo:
    es: 'Sokio'
    en: 'Sokio'
  # presentaciones: dónde se mostró el trabajo (nombre, lugar, ciudad,
  # inicio/fin, enlace). prensa: medio, titulo (tal cual se publicó),
  # fecha, enlace, archivo (copia en web.archive.org, opcional).
  presentaciones:
    - nombre:
        es: 'Splitting/Absence, ciclo Nueva Ópera'
        en: 'Splitting/Absence, Nueva Ópera series'
      lugar: 'GAM, Sala A2'
      ciudad: 'Santiago'
      inicio: '2026-03'
      enlace: 'https://gam.cl/es/que-hacer-en-gam/nueva-opera/splitting-absence/'
    - nombre:
        es: 'Section: New York, adelanto en formato taller de Splitting/Absence, encargo de Historias (The Clemente Center y New Latin Wave)'
        en: 'Section: New York, a preview workshop of Splitting/Absence, commissioned by Historias (The Clemente Center and New Latin Wave)'
      lugar: 'Teatro Latea'
      ciudad: 'Nueva York'
      inicio: '2025-05'
      enlace: 'https://historias.nyc/programming/commissions/splitting-absence/'
  prensa:
    - medio: 'La Tercera, Culto'
      titulo: 'Ópera y electrónica desnudan a Gordon Matta-Clark en el GAM'
      fecha: '2026-03'
      enlace: 'https://www.latercera.com/culto/noticia/opera-y-electronica-desnudan-a-gordon-matta-clark-en-el-gam/'
    - medio: 'Revista Velvet'
      titulo: 'Ópera y electrónica revisitan la obra de Gordon Matta-Clark en GAM'
      fecha: '2026-03'
      enlace: 'https://revistavelvet.cl/opera-y-electronica-revisitan-la-obra-de-gordon-matta-clark-en-gam/'
    - medio: 'BioBioChile'
      titulo: 'Estrenan en Chile la ópera Splitting/ Absence inspirada en Gordon Matta-Clark'
      fecha: '2026-02'
      enlace: 'https://www.biobiochile.cl/noticias/artes-y-cultura/actualidad-cultural/2026/02/10/estrenan-en-chile-la-opera-splitting-absence-inspirada-en-gordon-matta-clark.shtml'
    - medio: 'Culturizarte'
      titulo: 'Entrevista a compositor de la ópera «Splitting/Absence» Sokio: «Una ópera es una historia en música»'
      fecha: '2026-04'
      enlace: 'https://culturizarte.cl/entrevista-a-compositor-de-la-obra-de-teatro-splitting-absence-sokio-una-opera-es-una-historia-en-musica/'
  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          desarrollo de una máquina percutora robótica con solenoides controlados por MIDI para uso en la ópera Splitting/Absence.
        en: |-
          development of a robotic percussion machine with MIDI-controlled solenoids for use in the opera Splitting/Absence.
    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          Aarón Montoya-Moraga: planificación, compra de materiales y gestión del proyecto.<br>
          Matías Serrano: esquemático, placa de circuito impreso y prototipado.<br>
          Francisco Stephens: prototipado y soldadura.<br>
          Bernardita Jesús: prototipado y fabricación.
        en: |-
          Aarón Montoya-Moraga: planning, purchasing of materials and project management.<br>
          Matías Serrano: schematic, printed circuit board and prototyping.<br>
          Francisco Stephens: prototyping and soldering.<br>
          Bernardita Jesús: prototyping and fabrication.
    - id: enlaces
      titulo:
        es: 'enlaces'
        en: 'links'
      content:
        es: 'instagram de la ópera: <a href="https://www.instagram.com/splittingabsence/">@splittingabsence</a>'
        en: 'the opera on instagram: <a href="https://www.instagram.com/splittingabsence/">@splittingabsence</a>'

