        en: 'Talleres Momentos at Universidad Diego Portales, photo 6'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2023-universidad-diego-portales-talleres-momentos/webp/teaching-7.webp'
      alt:
        es: 'Talleres Momentos en la Universidad Diego Portales, foto 7'
        en: 'Talleres Momentos at Universidad Diego Portales, photo 7'
    - image: 'https://cdn.jsdelivr.net/gh/piruetasxyz/piruetas-web-media@main/2023-universidad-diego-portales-talleres-momentos/webp/teaching-8.webp'
      alt:
        es: 'Talleres Momentos en la Universidad Diego Portales, foto 8'
        en: 'Talleres Momentos at Universidad Diego Portales, photo 8'
  sections:
    - id: descripcion
      titulo:
        es: 'descripción'
        en: 'description'
      content:
        es: |-
          Talleres Momentos fue un ciclo de cuatro talleres de programación aplicada a artes y diseño, diseñados y dictados por el equipo de piruetas en Momentos: trayectorias de investigación aplicada, evento de exposición, talleres y charlas de la Universidad Diego Portales, entre el 20 de noviembre y el 1 de diciembre de 2023 en la Biblioteca Nicanor Parra, Santiago. participaron 50 personas: estudiantes de distintas escuelas de la UDP y personas externas.
          <br><br>
          los talleres fueron sensores y actuadores con Arduino, web e interactividad con p5.js, IA y web con ml5.js, y apps e interfaces con Figma.
        en: |-
          Talleres Momentos was a series of four workshops on programming applied to art and design, designed and taught by the piruetas team at Momentos: trayectorias de investigación aplicada (trajectories of applied research), an exhibition, workshops and talks event by Universidad Diego Portales, from november 20 to december 1 2023 at Biblioteca Nicanor Parra, Santiago. 50 people took part: students from different UDP schools and people from outside the university.
          <br><br>
          the workshops were sensors and actuators with Arduino, web and interactivity with p5.js, AI and web with ml5.js, and apps and interfaces with Figma.
    - id: documentacion
      titulo:
        es: 'documentación'
        en: 'documentation'
      content:
        es: |-
          material de los talleres: <a href="https://github.com/piruetasxyz/2023-11-talleres-momentos">github.com/piruetasxyz/2023-11-talleres-momentos</a>
        en: |-
          workshop materials: <a href="https://github.com/piruetasxyz/2023-11-talleres-momentos">github.com/piruetasxyz/2023-11-talleres-momentos</a>
    - id: creditos
      titulo:
        es: 'créditos'
        en: 'credits'
      content:
        es: |-
          Aarón Montoya-Moraga: diseño y dictado de talleres de Arduino, p5.js y ml5.js; ayudante del taller de Figma.<br>
          Janis Sepúlveda: dictado del taller de Figma; ayudante del taller de p5.js.<br>
          Sofía Sandoval: ayudante de los talleres de p5.js y Figma.<br>
          Andrés Martin, Ignacio Passalacqua: ayudantes del taller de Arduino.<br>
          Joaquín Pérez, Vale Montecinos: ayudantes del taller de ml5.js.
        en: |-
          Aarón Montoya-Moraga: design and teaching of the Arduino, p5.js and ml5.js workshops; assistant in the Figma workshop.<br>
          Janis Sepúlveda: teaching of the Figma workshop; assistant in the p5.js workshop.<br>
          Sofía Sandoval: assistant in the p5.js and Figma workshops.<br>
          Andrés Martin, Ignacio Passalacqua: assistants in the Arduino workshop.<br>
          Joaquín Pérez, Vale Montecinos: assistants in the ml5.js workshop.
    - titulo:
        es: 'proyectos'
        en: 'projects'
      content:
        es: '<a href="/proyectos/talleres-momentos/index.html">Talleres Momentos</a>'
        en: '<a href="/proyectos/talleres-momentos/index.html">Talleres Momentos</a>'
